# SonarQube configuration for the Dart/Flutter sources.
#
# Requirements and edition caveats are documented in docs/code-quality.md.
# SONAR_TOKEN and SONAR_HOST_URL must be supplied as GitLab CI/CD variables,
# never committed to this repository.

sonar.projectKey=callfilter
sonar.projectName=CallFilter
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=lib
sonar.tests=test,integration_test
sonar.inclusions=lib/**/*.dart,test/**/*.dart,integration_test/**/*.dart

# Generated code, build output, dependencies and platform scaffolding are not
# part of the Dart quality model. Native code is covered by Semgrep/native
# tests instead of being mixed into the Dart project analysis.
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/l10n/gen/**,build/**,.dart_tool/**,.pub-cache/**,coverage/**,android/**,ios/**,linux/**,macos/**,web/**,windows/**

sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,lib/l10n/gen/**
sonar.cpd.exclusions=**/*.g.dart,**/*.freezed.dart,lib/l10n/gen/**
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Fail the scanner when the server-side quality gate fails. The scanner job is
# conditional on SONAR_TOKEN/SONAR_HOST_URL in GitLab CI.
sonar.qualitygate.wait=true
